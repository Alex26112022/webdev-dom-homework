<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Код писать здесь
    console.log("It works!");

    let comments = [
      {
        id: 0,
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likes: 3,
        isLiked: false
      },
      {
        id: 1,
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likes: 75,
        isLiked: true
      }
    ];

    let nextId = 2;

    const commentsList = document.querySelector('.comments');
    const nameInput = document.querySelector('.add-form-name');
    const textInput = document.querySelector('.add-form-text');
    const addButton = document.querySelector('.add-form-button');

    const dateOptions = {
      year: '2-digit',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    };

    function render() {
      commentsList.innerHTML = '';

      comments.forEach(comment => {
        const li = document.createElement('li');
        li.className = 'comment';
        li.innerHTML = `
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">${comment.text}</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${comment.isLiked ? '-active-like' : ''}" data-id="${comment.id}"></button>
            </div>
          </div>
        `;
        commentsList.append(li);
      });

      document.querySelectorAll('.like-button').forEach(button => {
        button.addEventListener('click', onLikeClick);
      });
    }

    function onLikeClick(event) {
      const id = Number(event.currentTarget.dataset.id);

      const comment = comments.find(c => c.id === id);
      if (!comment) return;

      comment.isLiked = !comment.isLiked;
      comment.likes = comment.isLiked ? comment.likes + 1 : comment.likes - 1;

      render();
    }

    function clearErrors() {
      nameInput.classList.remove('error-input');
      textInput.classList.remove('error-input');
    }

    addButton.addEventListener('click', () => {
      clearErrors();

      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name) nameInput.classList.add('error-input');
      if (!text) textInput.classList.add('error-input');
      if (!name || !text) return;

      const now = new Date();
      const date = now.toLocaleString('ru-RU', dateOptions).replace(',', '');

      comments.push({
        id: nextId++,
        name: name,
        date: date,
        text: text,
        likes: 0,
        isLiked: false
      });

      nameInput.value = '';
      textInput.value = '';

      render();
    });

    nameInput.addEventListener('focus', clearErrors);
    textInput.addEventListener('focus', clearErrors);

    render();

  </script>
</html>
