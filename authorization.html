<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="add-form form-auth">
        <div>
          <input
            type="text"
            id="auth-login"
            name="auth-login"
            class="add-form-name"
            placeholder="Введите логин"
            autocomplete="on"
          />
          <input
            type="password"
            id="auth-password"
            name="auth-password"
            class="add-form-name"
            placeholder="Введите пароль"
            autocomplete="on"
          />
        </div>
        <div class="add-form-row form-auth-row">
          <button type="submit" class="add-form-button" id="auth-button">Авторизоваться</button>
        </div>
      </form>
      <div>
      <a href="index.html" class="text navigation">На главную</a>
      <a href="registration.html" class="text navigation">Регистрация</a>
      </div>
    </div>
    <script type="module" src="js_modules/auth.js"></script>
  </body>
</html>
