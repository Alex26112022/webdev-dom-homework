<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация-авторизация</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="add-form form-auth">
        <div>
          <input type="text" id="auth-login" class="add-form-name" placeholder="Введите логин" />
          <input
            type="password"
            id="auth-password"
            class="add-form-name"
            placeholder="Введите пароль"
          />
        </div>
        <div class="add-form-row form-auth-row">
          <button type="button" class="add-form-button" id="auth-button">Авторизоваться</button>
        </div>
      </form>
      <a href="index.html" class="text on-main">На главную</a>
    </div>
    <script type="module" src="js_modules/auth.js"></script>
  </body>
</html>
