<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация-авторизация</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="add-form form-auth">
        <div>
          <input type="text" class="add-form-name" placeholder="Введите логин" />
          <input type="password" class="add-form-name" placeholder="Введите пароль" />
        </div>
        <div class="add-form-row form-auth-row">
          <button type="submit" class="add-form-button" id="authorization">Авторизоваться</button>
        </div>
      </form>
    </div>
    <script type="module" src="auth.js"></script>
  </body>
</html>
